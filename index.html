<style>
@font-face{
  font-family:Bitter;font-style:normal;font-weight:700;font-display:swap;
  src:url(vendor/bitter-700-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face{
  font-family:Bitter;font-style:normal;font-weight:700;font-display:swap;
  src:url(vendor/bitter-700-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

:root{
  --las:      #0E2A20;
  --las-mgla: rgba(14,42,32,.94);
  --szklo:    #1F6E5B;
  --zrodlo:   #9C4A22;
  --snieg:    #EEF2EE;
  --kamien:   #7C857E;
  --linia:    rgba(238,242,238,.14);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--las)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--snieg);-webkit-font-smoothing:antialiased;
}
#mapa{position:absolute;inset:0}

/* ---------- ekran wczytywania ---------- */
.start{
  position:absolute;inset:0;z-index:20;background:var(--las);
  display:grid;place-content:center;justify-items:center;gap:15px;text-align:center;
  padding:24px;transition:opacity .45s ease;
}
.start[data-koniec="1"]{opacity:0;pointer-events:none}
.start h1{font-family:Bitter,Georgia,serif;font-weight:700;font-size:30px;letter-spacing:-.02em}
.start p{font-size:13.5px;color:var(--kamien);max-width:34ch;line-height:1.55}
.pasek{width:150px;height:2px;background:var(--linia);overflow:hidden}
.pasek i{display:block;width:40%;height:100%;background:var(--szklo);animation:suw 1.15s ease-in-out infinite}
@keyframes suw{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
@media (prefers-reduced-motion:reduce){.pasek i{animation:none;width:100%}}

/* ---------- pasek górny ---------- */
.gora{
  position:absolute;top:0;left:0;right:0;z-index:5;
  padding:calc(env(safe-area-inset-top) + 12px) 0 0;pointer-events:none;
}
.rzad{display:flex;align-items:center;gap:9px;padding:0 14px}
.znak{
  pointer-events:auto;background:var(--las-mgla);border:1px solid var(--linia);
  border-radius:3px;padding:7px 13px 8px;
  font-family:Bitter,Georgia,serif;font-weight:700;font-size:16px;letter-spacing:-.01em;
}
.znak span{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--kamien);font-weight:400;font-size:11.5px;margin-left:7px;
}
.oto{
  pointer-events:auto;margin-left:auto;background:var(--las-mgla);border:1px solid var(--linia);
  border-radius:3px;color:var(--snieg);font:inherit;font-size:13px;padding:9px 14px;cursor:pointer;
}
.oto:focus-visible{outline:2px solid var(--snieg);outline-offset:2px}

.tematy{
  pointer-events:auto;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:9px 14px 2px;
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
}
.tematy::-webkit-scrollbar{display:none}
.tematy button{
  flex:0 0 auto;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;
  background:var(--las-mgla);color:var(--kamien);
  border:1px solid var(--linia);border-radius:3px;padding:6px 12px;
}
.tematy button[aria-pressed="true"]{background:var(--szklo);color:var(--snieg);border-color:var(--szklo)}
.tematy button:focus-visible{outline:2px solid var(--snieg);outline-offset:2px}

/* ---------- pinezki ---------- */
.pin{cursor:pointer;display:grid;place-items:center;transform-origin:50% 100%}
.pin i{
  display:grid;place-items:center;width:23px;height:23px;border-radius:50%;
  border:2px solid var(--snieg);box-shadow:0 2px 9px rgba(0,0,0,.5);
}
.pin svg{display:block}
.pin.partner i{width:34px;height:34px;border-width:2.5px;box-shadow:0 0 0 5px rgba(156,74,34,.26),0 3px 12px rgba(0,0,0,.55)}
.pin.wybrany i{outline:2.5px solid var(--snieg);outline-offset:2px}

/* ---------- taśma kafelków ---------- */
.tasma{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 14px);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);
}
.tasma::-webkit-scrollbar{display:none}
.kafel{
  scroll-snap-align:start;flex:0 0 auto;background:var(--las-mgla);
  border:1px solid var(--linia);border-radius:3px;padding:9px 13px 10px;
  text-align:left;cursor:pointer;font:inherit;color:var(--snieg);max-width:64vw;
  border-left:3px solid var(--kamien);
}
.kafel b{display:block;font-family:Bitter,Georgia,serif;font-weight:700;font-size:14px;white-space:nowrap}
.kafel em{display:block;font-style:normal;font-size:11.5px;color:var(--kamien);margin-top:2px}
.kafel:focus-visible{outline:2px solid var(--snieg);outline-offset:2px}

/* ---------- panel ---------- */
.panel{
  position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--las);
  border-top:1px solid var(--linia);border-radius:10px 10px 0 0;
  padding:16px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(110%);transition:transform .28s cubic-bezier(.22,.7,.3,1);
  max-height:74vh;overflow-y:auto;box-shadow:0 -14px 44px rgba(0,0,0,.5);
}
.panel[data-otwarty="1"]{transform:translateY(0)}
.uchwyt{width:34px;height:3px;border-radius:2px;background:var(--kamien);opacity:.5;margin:0 auto 14px}
.plakietka{display:inline-block;font-size:10.5px;letter-spacing:.06em;color:var(--zrodlo);border:1px solid var(--zrodlo);border-radius:2px;padding:2px 6px;margin-bottom:9px}
.panel h2{font-family:Bitter,Georgia,serif;font-weight:700;font-size:22px;line-height:1.2;letter-spacing:-.015em}
.meta{font-size:12.5px;color:var(--kamien);margin-top:5px}
.panel p{font-size:14.5px;line-height:1.62;margin-top:13px;max-width:62ch;color:rgba(238,242,238,.88)}
.wiedz{
  margin-top:14px;padding:11px 13px;border-left:2px solid var(--zrodlo);
  background:rgba(156,74,34,.09);font-size:13.5px;line-height:1.55;max-width:62ch;
}
.dystans{display:flex;align-items:baseline;gap:9px;margin-top:15px;padding-top:14px;border-top:1px solid var(--linia)}
.dystans strong{font-family:Bitter,Georgia,serif;font-size:26px;font-weight:700}
.dystans span{font-size:12.5px;color:var(--kamien)}
.akcje{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}
.akcje a,.akcje button{font:inherit;font-size:14px;text-decoration:none;cursor:pointer;padding:11px 17px;border-radius:3px;border:1px solid var(--linia);background:none;color:var(--snieg)}
.akcje .glowna{background:var(--szklo);border-color:var(--szklo)}
.akcje .partnerska{background:var(--zrodlo);border-color:var(--zrodlo)}
.akcje a:focus-visible,.akcje button:focus-visible{outline:2px solid var(--snieg);outline-offset:2px}

/* ---------- lokalizacja ---------- */
.gps{
  position:absolute;right:14px;z-index:6;bottom:calc(env(safe-area-inset-bottom) + 78px);
  width:46px;height:46px;border-radius:50%;background:var(--las-mgla);
  border:1px solid var(--linia);color:var(--snieg);display:grid;place-items:center;cursor:pointer;
}
.gps[data-akt="1"]{background:var(--szklo);border-color:var(--szklo)}
.gps svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8}
.ja{width:16px;height:16px;border-radius:50%;background:#4FA3FF;border:2.5px solid #fff;box-shadow:0 0 0 6px rgba(79,163,255,.22)}

.info{
  position:absolute;left:14px;right:14px;top:50%;z-index:9;transform:translateY(-50%);
  background:var(--las);border:1px solid var(--zrodlo);border-radius:4px;
  padding:16px 18px;font-size:14px;line-height:1.55;display:none;
}
.info[data-widok="1"]{display:block}
.info button{font:inherit;font-size:13px;margin-top:12px;cursor:pointer;background:none;border:1px solid var(--linia);color:var(--snieg);padding:7px 13px;border-radius:3px}

/* ---------- tryb kalibracji (?kalibracja=1) ---------- */
body.kalibracja .pin{pointer-events:none}
body.kalibracja .tasma,body.kalibracja .tematy,body.kalibracja .oto{display:none}
.kal,.kal-wynik{
  position:absolute;left:14px;right:14px;z-index:12;
  bottom:calc(env(safe-area-inset-bottom) + 14px);
  background:var(--las);border:1px solid var(--zrodlo);border-radius:5px;padding:14px 16px;
}
.kal[hidden],.kal-wynik[hidden]{display:none}
.kal-glowa{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.kal-glowa span{font-size:11.5px;color:var(--kamien)}
.kal b{font-family:Bitter,Georgia,serif;font-weight:700;font-size:18px;display:block}
.kal p{font-size:13px;color:var(--kamien);margin-top:5px;line-height:1.45}
.kal-akcje{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.kal button,.kal-wynik button{
  font:inherit;font-size:13px;cursor:pointer;padding:8px 13px;border-radius:3px;
  border:1px solid var(--linia);background:none;color:var(--snieg);
}
.kal-wynik textarea{
  width:100%;height:34vh;margin-top:10px;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.45;
  background:#082018;color:var(--snieg);border:1px solid var(--linia);border-radius:3px;padding:9px;
}
.kal-wynik b{font-family:Bitter,Georgia,serif;font-weight:700;font-size:15px}

.maplibregl-ctrl-attrib{font-size:10px}
@media (prefers-reduced-motion:reduce){.panel,.start{transition:none}}
</style>
</head>
<body>

<div id="mapa"></div>

<div class="start" id="start">
  <h1>Tylicz</h1>
  <div class="pasek"><i></i></div>
  <p id="start-opis">Dawne miasteczko biskupie, siedlisko konfederatów barskich</p>
</div>

<div class="gora">
  <div class="rzad">
    <div class="znak">Tylicz <span>575 m n.p.m.</span></div>
    <button class="oto" id="oto" type="button">O Tyliczu</button>
  </div>
  <div class="tematy" id="tematy" role="group" aria-label="Temat"></div>
</div>

<button class="gps" id="gps" type="button" aria-label="Pokaż moją pozycję">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
</button>

<div class="tasma" id="tasma"></div>

<section class="panel" id="panel" aria-live="polite">
  <div class="uchwyt"></div>
  <div id="panel-tresc"></div>
</section>

<div class="info" id="info">
  <div id="info-tresc"></div>
  <button type="button" onclick="document.getElementById('info').dataset.widok='0'">Zamknij</button>
</div>

<div class="kal" id="kal" hidden>
  <div class="kal-glowa">
    <span id="kal-licznik"></span>
    <button type="button" id="kal-koniec">Zakończ i pokaż kod</button>
  </div>
  <b id="kal-nazwa"></b>
  <p>Kliknij w mapę dokładnie tam, gdzie to miejsce naprawdę jest.</p>
  <div class="kal-akcje">
    <button type="button" id="kal-pokaz">Pokaż obecną pinezkę</button>
    <button type="button" id="kal-cofnij">Cofnij</button>
    <button type="button" id="kal-pomin">Pomiń</button>
  </div>
</div>

<div class="kal-wynik" id="kal-wynik" hidden>
  <b>Gotowe — podmień tablicę POI w index.html</b>
  <textarea id="kal-tekst" readonly spellcheck="false"></textarea>
  <div class="kal-akcje">
    <button type="button" id="kal-kopiuj">Kopiuj do schowka</button>
    <button type="button" id="kal-wroc">Wróć do poprawiania</button>
  </div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script>

  woda:        {barwa:'#3A7CA5', nazwa:'Wody mineralne',  ikona:'M12 3s5.5 6.3 5.5 10.2A5.5 5.5 0 016.5 13.2C6.5 9.3 12 3 12 3z'},

const TEMATY = [

const POI = [
  {
    id:'tyliczski', nazwa:'TYLICZ.ski', kat:'narty', tematy:['zima'],
    lat:49.3985, lng:21.0196, partner:true, www:'https://tylicz.ski',
    opis:'Największa stacja w Tyliczu, przy ulicy Wolności — sześć kilometrów tras i dwie koleje krzesełkowe. Trasy naśnieżane, ratrakowane i oświetlone po zmierzchu, o długości od 150 do 1200 m. Osobne poletko dla początkujących i przedszkole narciarskie.'
  },
  {
    id:'kosciol', nazwa:'Kościół św. Piotra i Pawła', kat:'zabytek', tematy:['zabytki','konfederaci'],
    lat:49.3951, lng:21.0262,
    opis:'Drewniany, wzniesiony w 1612 r. z fundacji biskupa krakowskiego Piotra Tylickiego, konsekrowany dopiero pół wieku później. Konstrukcja zrębowa, jedna nawa, barokowa wieżyczka sygnaturkowa nad dachem. W prezbiterium trzy rokokowe ołtarze z drugiej połowy XVIII w., w głównym obraz Matki Boskiej Tylickiej z przełomu XVI i XVII w. Przed kościołem dzwonnica z dzwonem z 1665 r.',
    wiedz:'Wisi tu obraz świętej Barbary, patronki artylerzystów — według przekazów prywatny obraz Kazimierza Pułaskiego, który woził go ze sobą i wieszał w namiocie. Zostawił go tylickiemu kościołowi jako wotum. Chrzcielnica pochodzi ze szkoły Wita Stwosza, a krucyfiks rzeźbiony w jednym pniu jest jeszcze czternastowieczny.'
  },
  {
    id:'cerkiew', nazwa:'Cerkiew św. Kosmy i Damiana', kat:'zabytek', tematy:['zabytki'],
    lat:49.3963, lng:21.0241,
    opis:'Drewniana cerkiew greckokatolicka z lat 1738–1744, w typie zachodniołemkowskim: trójdzielna bryła, trzy wieże, wieża główna o konstrukcji słupowej. W środku osiemnastowieczny ikonostas i późnobarokowy ołtarz z ikoną Matki Bożej w drewnianej sukience. Dziś służy jako kościół cmentarny.',
    wiedz:'Polichromia z 1938 r. powstała na 950-lecie Chrztu Rusi — święte Olga i Włodzimierz wzorowane są na ikonach z kijowskiego Soboru św. Włodzimierza. W nawie wisi obraz Chrystusa w Ogrójcu z widocznym śladem po kuli, wystrzelonej przez słowackich żołnierzy w pierwszych dniach września 1939 r.'
  },
  {
    id:'rynek', nazwa:'Rynek', kat:'zabytek', tematy:['zabytki','konfederaci'],

    opis:'Czworoboczny plac z promieniście odchodzącymi uliczkami — zachowany średniowieczny układ miasteczka. Nawierzchnia od wieków z kocich łbów, od strony kościoła murowana kapliczka z 1808 r. Odbywały się tu cotygodniowe targi i cztery jarmarki rocznie.',

  },
  {

    opis:'Siedmiometrowy kopiec na zboczu Huzarów, przy drodze z Krynicy do Tylicza. Na szczycie pomnik w kształcie graniastosłupa z orłem zrywającym się do lotu.',
    wiedz:'Usypany staraniem doktora Franciszka Kmietowicza, burmistrza Krynicy, i odsłonięty 25 sierpnia 1929 r. W czasach PRL temat konfederacji spychano na margines, bo była to wojna z Rosją.'
  },
  {
    id:'okopy', nazwa:'Okopy Konfederatów Barskich', kat:'konfederaci', tematy:['konfederaci'],

/* =================================================================== */

const nietDrgania = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const KAL = new URLSearchParams(location.search).get('kalibracja') === '1';
let temat = 'wszystko', wybrany = null, pinezki = {}, mojaPozycja = null,
    znacznikJa = null, obserwator = null, dojechalo = false;

const $ = s => document.querySelector(s);
const panel = $('#panel');

const map = new maplibregl.Map({
  container:'mapa',
  style:'https://tiles.openfreemap.org/styles/liberty',
  center:CENTRUM, zoom:15.2, pitch:0, bearing:-22,
  maxBounds:RAMY, minZoom:13, maxZoom:18.5, maxPitch:52,
  fadeDuration:0, refreshExpiredTiles:false,
  attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'bottom-left');
map.touchZoomRotate.enableRotation();

map.on('load', () => {
  if(map.setSky){
    map.setSky({
      'sky-color':'#8FB8C9','horizon-color':'#D6DCD4','fog-color':'#C9D2CB',
      'sky-horizon-blend':.7,'horizon-fog-blend':.5,'fog-ground-blend':.05
    });
  }
  const wektor = zrodloWektorowe();
  odchudzStyl();
  dodajBudynki(wektor);
  wyroznijSciezki(wektor);
  nazwyUlic();
  szczyty(wektor);
  rysujPinezki();
  budujTematy();
  budujTasme();
});

/* Liberty ma około stu pięćdziesięciu warstw. Numery domów i lotniska
   są tu bezużyteczne, a etykiety sklepów wystarczą od bliska —
   rozmieszczanie napisów z wykrywaniem kolizji to najdroższa rzecz,
   jaką ta biblioteka robi przy obracaniu mapy. */
function odchudzStyl(){
  const doWyciecia = ['housenumber','aeroway','aerodrome_label'];
  map.getStyle().layers.forEach(l => {
    const sl = l['source-layer'];
    try{
      if(doWyciecia.includes(sl)) map.setLayoutProperty(l.id, 'visibility', 'none');
      else if(sl === 'poi' && l.type === 'symbol') map.setLayerZoomRange(l.id, 16, 24);
    }catch(e){}
  });
}

map.once('idle', wlaczTeren);
setTimeout(() => { if(!dojechalo) wlaczTeren(); }, 5000);

function wlaczTeren(){
  if(dojechalo) return;
  dojechalo = true;
  $('#start').dataset.koniec = '1';

  /* W kalibracji mapa zostaje płaska: na pochylonym terenie trudno
     trafić w konkretny budynek. */
  if(KAL){ startKalibracji(); return; }

  try{
    map.addSource('nmt', {
      type:'raster-dem',
      tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding:'terrarium', tileSize:256, maxzoom:12,
      attribution:'Rzeźba terenu: AWS Terrain Tiles'
    });
    map.setTerrain({source:'nmt', exaggeration:1.35});
  }catch(e){ console.warn('Brak rzeźby terenu:', e); }

  bazowyPR = policzBazowyPR();
  ustawPR(1);
  if(JAKOSC === 'plynna'){ poziom = 2; ustawPR(.7); naCieniowanie(); czujnikStop = true; }
  else if(JAKOSC === 'pelna'){ czujnikStop = true; }
  else map.on('render', czujnik);

  if(nietDrgania){ map.jumpTo({pitch:50}); pokazOTyliczu(); return; }
  map.easeTo({pitch:50, zoom:15.35, duration:2400});
  setTimeout(pokazOTyliczu, 2600);
}

const zrodloWektorowe = () => {
  const z = map.getStyle().sources;
  return Object.keys(z).find(k => z[k].type === 'vector');
};
const pierwszySymbol = () => {
  const l = map.getStyle().layers.find(x => x.type === 'symbol');
  return l ? l.id : undefined;
};

function dodajBudynki(wektor){
  if(!wektor) return;
  try{
    map.addLayer({
      id:'bryly', type:'fill-extrusion', source:wektor, 'source-layer':'building', minzoom:14,
      paint:{
        'fill-extrusion-color':[
          'interpolate',['linear'],['coalesce',['get','render_height'],6],
          0,'#DDE3DC', 12,'#C4CDC4', 30,'#A9B4A9'
        ],
        'fill-extrusion-height':['coalesce',['get','render_height'],6],
        'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
        'fill-extrusion-opacity':.92
      }
    }, pierwszySymbol());
  }catch(e){ console.warn('Brak warstwy budynków:', e); }
}

/* Ścieżki i drogi leśne przerywaną kreską — dzięki temu mapa czyta się
   jak turystyczna, a nie jak samochodowa. */
function wyroznijSciezki(wektor){
  if(!wektor) return;
  try{
    map.addLayer({
      id:'szlaki', type:'line', source:wektor, 'source-layer':'transportation', minzoom:13,
      filter:['match',['get','class'],['path','track'],true,false],
      layout:{'line-cap':'round'},
      paint:{
        'line-color':'#8A5A3B',
        'line-width':['interpolate',['linear'],['zoom'],13,1.1,16,2.4],
        'line-dasharray':[2,1.6],
        'line-opacity':.75
      }
    }, pierwszySymbol());
  }catch(e){ console.warn('Brak warstwy ścieżek:', e); }
}

/* Styl pokazuje nazwy ulic dopiero bardzo blisko i bardzo drobno. */
function nazwyUlic(){
  map.getStyle().layers.forEach(l => {
    if(l.type !== 'symbol' || l['source-layer'] !== 'transportation_name') return;
    try{
      map.setLayerZoomRange(l.id, 14, 24);
      map.setLayoutProperty(l.id, 'text-size',
        ['interpolate',['linear'],['zoom'],14,10.5,17,13.5]);
      map.setPaintProperty(l.id, 'text-halo-color', 'rgba(255,255,255,.92)');
      map.setPaintProperty(l.id, 'text-halo-width', 1.5);
    }catch(e){ /* część warstw nie ma tych właściwości */ }
  });
}

/* Szczyty z wysokością — w górach to podstawowa informacja na mapie. */
function szczyty(wektor){
  if(!wektor) return;
  map.getStyle().layers.forEach(l => {
    if(l['source-layer'] === 'mountain_peak'){
      try{ map.setLayoutProperty(l.id, 'visibility', 'none'); }catch(e){}
    }
  });
  try{
    map.addLayer({
      id:'szczyty', type:'symbol', source:wektor, 'source-layer':'mountain_peak', minzoom:13,
      filter:['>=',['to-number',['coalesce',['get','ele'],0]],600],
      layout:{
        'text-field':['concat',['get','name'],'\n',['to-string',['get','ele']],' m'],
        'text-font':['Noto Sans Regular'],
        'text-size':11.5,
        'text-offset':[0,.6],
        'text-anchor':'top',
        'symbol-sort-key':['-',0,['to-number',['coalesce',['get','ele'],0]]]
      },
      paint:{
        'text-color':'#4A5450',
        'text-halo-color':'rgba(255,255,255,.9)',
        'text-halo-width':1.5
      }
    });
  }catch(e){ console.warn('Brak warstwy szczytów:', e); }
}

function ikonaSVG(kat, rozmiar){
  const k = KATEGORIE[kat] || KATEGORIE.widok;
  return '<svg viewBox="0 0 24 24" width="' + rozmiar + '" height="' + rozmiar + '">' +
         '<path d="' + k.ikona + '" fill="none" stroke="#fff" stroke-width="2" ' +
         'stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function rysujPinezki(){
  POI.forEach(p => {
    const k = KATEGORIE[p.kat] || KATEGORIE.widok;
    const el = document.createElement('div');
    el.className = 'pin' + (p.partner ? ' partner' : '');
    el.innerHTML = '<i style="background:' + (p.partner ? '#9C4A22' : k.barwa) + '">' +
                   ikonaSVG(p.kat, p.partner ? 17 : 12) + '</i>';
    el.setAttribute('role','button');
    el.setAttribute('aria-label', p.nazwa);
    el.addEventListener('click', ev => { ev.stopPropagation(); pokaz(p.id); });
    pinezki[p.id] = new maplibregl.Marker({element:el, anchor:'bottom'})
      .setLngLat([p.lng, p.lat]).addTo(map);
  });
  filtruj();
}

function budujTematy(){
  const t = $('#tematy');
  t.innerHTML = '';
  TEMATY.forEach(x => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = x.nazwa;
    b.setAttribute('aria-pressed', String(x.id === temat));
    b.addEventListener('click', () => {
      temat = x.id;
      budujTematy(); filtruj(); budujTasme();
      panel.dataset.otwarty = '0';
    });
    t.appendChild(b);
  });
}

const widoczne = () => POI
  .filter(p => temat === 'wszystko' || (p.tematy || []).includes(temat))
  .sort((a,b) => (b.partner ? 1 : 0) - (a.partner ? 1 : 0));

function filtruj(){
  const ok = new Set(widoczne().map(p => p.id));
  POI.forEach(p => { pinezki[p.id].getElement().style.display = ok.has(p.id) ? '' : 'none'; });
}

function budujTasme(){
  const t = $('#tasma');
  t.innerHTML = '';
  widoczne().forEach(p => {
    const k = KATEGORIE[p.kat] || KATEGORIE.widok;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'kafel';
    b.style.borderLeftColor = p.partner ? '#9C4A22' : k.barwa;
    b.innerHTML = '<b>' + p.nazwa + '</b><em>' +
                  (p.partner ? 'Miejsce partnerskie' : k.nazwa) + '</em>';
    b.addEventListener('click', () => pokaz(p.id));
    t.appendChild(b);
  });
}

function pokaz(id){
  const p = POI.find(x => x.id === id);
  if(!p) return;
  wybrany = id;
  Object.entries(pinezki).forEach(([k,m]) => m.getElement().classList.toggle('wybrany', k === id));
  map.easeTo({center:[p.lng, p.lat], zoom:16.6, pitch:50, offset:[0,-110],
              duration: nietDrgania ? 0 : 1100});
  rysujPanel(p);
  panel.dataset.otwarty = '1';
}

function rysujPanel(p){
  const k = KATEGORIE[p.kat] || KATEGORIE.widok;
  const nav = 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lng +
              '&travelmode=walking';

  let wys = null;
  try{ wys = map.queryTerrainElevation([p.lng, p.lat]); }catch(e){}
  const meta = k.nazwa + (wys ? ' · ' + Math.round(wys) + ' m n.p.m.' : '');

  let d;
  if(mojaPozycja){
    const m = odleglosc(mojaPozycja, [p.lng, p.lat]);
    const minuty = Math.max(1, Math.round(m / 78));
    d = '<div class="dystans"><strong>' +
        (m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1) + ' km') +
        '</strong><span>stąd, około ' + minuty + ' min pieszo</span></div>';
  }else{
    d = '<div class="dystans"><span>Włącz lokalizację, żeby zobaczyć odległość stąd.</span></div>';
  }

  $('#panel-tresc').innerHTML =
    (p.partner ? '<div class="plakietka">Miejsce partnerskie</div>' : '') +
    '<h2>' + p.nazwa + '</h2>' +
    '<div class="meta">' + meta + '</div>' +
    '<p>' + p.opis + '</p>' +
    (p.wiedz ? '<div class="wiedz">' + p.wiedz + '</div>' : '') +
    d +
    '<div class="akcje">' +
      '<a class="glowna" href="' + nav + '" target="_blank" rel="noopener">Prowadź pieszo</a>' +
      (p.www ? '<a class="partnerska" href="' + p.www + '" target="_blank" rel="noopener">Strona i cennik</a>' : '') +
      '<button type="button" onclick="document.getElementById(\'panel\').dataset.otwarty=\'0\'">Zamknij</button>' +
    '</div>';
}

function pokazOTyliczu(){
  wybrany = null;
  Object.values(pinezki).forEach(m => m.getElement().classList.remove('wybrany'));
  $('#panel-tresc').innerHTML =
    '<h2>Tylicz</h2>' +
    '<div class="meta">' + O_TYLICZU.meta + '</div>' +
    O_TYLICZU.akapity.map(a => '<p>' + a + '</p>').join('') +
    '<div class="akcje"><button type="button" ' +
    'onclick="document.getElementById(\'panel\').dataset.otwarty=\'0\'">Zwiedzam</button></div>';
  panel.dataset.otwarty = '1';
}
$('#oto').addEventListener('click', pokazOTyliczu);

$('#gps').addEventListener('click', () => {
  const btn = $('#gps');
  if(obserwator !== null){
    navigator.geolocation.clearWatch(obserwator);
    obserwator = null; mojaPozycja = null;
    if(znacznikJa){ znacznikJa.remove(); znacznikJa = null; }
    btn.dataset.akt = '0';
    return;
  }
  if(!navigator.geolocation){ komunikat('Ta przeglądarka nie udostępnia lokalizacji.'); return; }

  obserwator = navigator.geolocation.watchPosition(poz => {
    mojaPozycja = [poz.coords.longitude, poz.coords.latitude];
    btn.dataset.akt = '1';
    if(!znacznikJa){
      const el = document.createElement('div');
      el.className = 'ja';
      znacznikJa = new maplibregl.Marker({element:el}).setLngLat(mojaPozycja).addTo(map);
      map.easeTo({center:mojaPozycja, zoom:16.2, pitch:50, duration:1200});
    }else{
      znacznikJa.setLngLat(mojaPozycja);
    }
    if(wybrany && panel.dataset.otwarty === '1') rysujPanel(POI.find(x => x.id === wybrany));
  }, err => {
    komunikat('Nie udało się ustalić pozycji. Kod błędu: ' + err.code);
    btn.dataset.akt = '0'; obserwator = null;
  }, {enableHighAccuracy:true, maximumAge:8000, timeout:12000});
});

function komunikat(html){
  $('#info-tresc').innerHTML = html;
  $('#info').dataset.widok = '1';
}

function odleglosc(a, b){
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b[1] - a[1]), dLng = rad(b[0] - a[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* ===================================================================
   JAKOŚĆ — mierzy płynność i sama schodzi o poziom, gdy jest źle.

   0  pełna: siatka terenu, natywna gęstość pikseli
   1  mniej pikseli (rysowanie w niższej rozdzielczości)
   2  cieniowanie zboczy zamiast siatki terenu — znika przebieg
      do tekstury, czyli główny koszt trybu 3D w MapLibre

   Wymuszenie: ?jakosc=pelna albo ?jakosc=plynna
   =================================================================== */

const JAKOSC = new URLSearchParams(location.search).get('jakosc');
let poziom = 0, bazowyPR = 1, probki = [], ostatniaKlatka = 0, czujnikStop = false;

function policzBazowyPR(){
  const dpr = window.devicePixelRatio || 1;
  const c = map.getCanvas();
  const px = Math.max(1, c.clientWidth * c.clientHeight);
  const budzet = 2400000;                       // mniej więcej 1080p
  return Math.max(0.75, Math.min(dpr, Math.sqrt(budzet / px)));
}

function ustawPR(mnoznik){
  if(typeof map.setPixelRatio !== 'function') return;
  try{ map.setPixelRatio(Math.max(0.7, bazowyPR * mnoznik)); }catch(e){}
}

function naCieniowanie(){
  if(!map.getSource('nmt') || map.getLayer('cien')) return;
  try{
    map.setTerrain(null);
    const podKtora = (map.getStyle().layers.find(l => l.type === 'line') || {}).id;
    map.addLayer({
      id:'cien', type:'hillshade', source:'nmt',
      paint:{
        'hillshade-exaggeration':.55,
        'hillshade-shadow-color':'#5E6E62',
        'hillshade-highlight-color':'#FFFFFF',
        'hillshade-accent-color':'#818F84'
      }
    }, podKtora);
    map.setMaxPitch(46);
    if(map.getPitch() > 46) map.easeTo({pitch:46, duration:400});
  }catch(e){ console.warn('Cieniowanie niedostępne:', e); }
}

function zejdzPoziom(){
  poziom++;
  if(poziom === 1) ustawPR(.75);
  if(poziom >= 2){ ustawPR(.7); naCieniowanie(); czujnikStop = true; }
  console.log('Jakość obniżona do poziomu ' + poziom);
}

function czujnik(){
  if(czujnikStop || KAL) return;
  const t = performance.now();
  if(ostatniaKlatka && map.isMoving()){
    const dt = t - ostatniaKlatka;
    if(dt < 400) probki.push(dt);               // pomiń przerwy w ruchu
  }
  ostatniaKlatka = t;

  if(probki.length < 45) return;
  probki.sort((a,b) => a - b);
  const mediana = probki[Math.floor(probki.length / 2)];
  probki = [];

  if(mediana > 34){                             // poniżej mniej więcej 30 klatek
    if(poziom < 2) zejdzPoziom(); else czujnikStop = true;
  }else if(mediana < 21){
    czujnikStop = true;                         // jest dobrze, przestań mierzyć
  }
}

map.on('click', () => { if(!KAL) panel.dataset.otwarty = '0'; });

/* ===================================================================
   KALIBRACJA — ?kalibracja=1

   Przechodzi po kolei przez wszystkie punkty. Klikasz właściwe miejsce,
   pinezka od razu tam skacze, a na końcu dostajesz gotową tablicę POI
   z poprawionymi współrzędnymi i całą treścią bez zmian.
   =================================================================== */

let kalIdx = 0;
const kalWynik = POI.map(p => JSON.parse(JSON.stringify(p)));
const kalRuszone = new Set();

function startKalibracji(){
  document.body.classList.add('kalibracja');
  map.setMaxZoom(19);
  map.jumpTo({pitch:0, bearing:0, zoom:16});
  $('#kal').hidden = false;
  kalPokazKrok();
}

function kalPokazKrok(){
  if(kalIdx >= kalWynik.length){ kalKoniec(); return; }
  const p = kalWynik[kalIdx];
  $('#kal-licznik').textContent =
    'Punkt ' + (kalIdx + 1) + ' z ' + kalWynik.length +
    ' · poprawionych: ' + kalRuszone.size;
  $('#kal-nazwa').textContent = p.nazwa;

  Object.entries(pinezki).forEach(([id, m]) =>
    m.getElement().classList.toggle('wybrany', id === p.id));
}

function kalUstaw(lngLat){
  const p = kalWynik[kalIdx];
  p.lat = +lngLat.lat.toFixed(5);
  p.lng = +lngLat.lng.toFixed(5);
  kalRuszone.add(p.id);
  pinezki[p.id].setLngLat([p.lng, p.lat]);
  kalIdx++;
  kalPokazKrok();
}

function kalKoniec(){
  $('#kal').hidden = true;
  $('#kal-wynik').hidden = false;
  $('#kal-tekst').value = 'const POI = ' + JSON.stringify(kalWynik, null, 2) + ';';
}

if(KAL){
  map.on('click', e => kalUstaw(e.lngLat));

  $('#kal-pokaz').addEventListener('click', () => {
    const p = kalWynik[kalIdx];
    if(p) map.easeTo({center:[p.lng, p.lat], zoom:17, duration:700});
  });
  $('#kal-pomin').addEventListener('click', () => { kalIdx++; kalPokazKrok(); });
  $('#kal-cofnij').addEventListener('click', () => {
    if(kalIdx > 0) kalIdx--;
    kalPokazKrok();
  });
  $('#kal-koniec').addEventListener('click', kalKoniec);
  $('#kal-wroc').addEventListener('click', () => {
    $('#kal-wynik').hidden = true;
    $('#kal').hidden = false;
    if(kalIdx >= kalWynik.length) kalIdx = kalWynik.length - 1;
    kalPokazKrok();
  });
  $('#kal-kopiuj').addEventListener('click', () => {
    const t = $('#kal-tekst');
    t.select();
    if(navigator.clipboard) navigator.clipboard.writeText(t.value);
    $('#kal-kopiuj').textContent = 'Skopiowane';
    setTimeout(() => { $('#kal-kopiuj').textContent = 'Kopiuj do schowka'; }, 1800);
  });
}

map.on('error', e => {
  console.error(e && e.error);
  if(!dojechalo) $('#start-opis').textContent = 'Mapa nie chce się wczytać. Sprawdź konsolę przeglądarki.';
});

if(new URLSearchParams(location.search).get('edit') === '1'){
  map.on('click', e => {
    const s = 'lat:' + e.lngLat.lat.toFixed(5) + ', lng:' + e.lngLat.lng.toFixed(5);
    console.log(s);
    if(navigator.clipboard) navigator.clipboard.writeText(s);
    komunikat('Skopiowano:<br><br><code>' + s + '</code>');
  });
}
